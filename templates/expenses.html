<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Expenses</title>

<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="container">

    <h1>Expense Manager</h1>

    <div class="card">

        <h2>Add Expense</h2>

        <form action="/expenses" method="POST">

            <input
                type="text"
                name="title"
                placeholder="Expense Title"
                required
            >

            <input
                type="number"
                step="0.01"
                name="amount"
                placeholder="Amount"
                required
            >

            <select name="category">

                <option>Food</option>

                <option>Shopping</option>

                <option>Transport</option>

                <option>Bills</option>

                <option>Education</option>

                <option>Entertainment</option>

                <option>Other</option>

            </select>

            <button type="submit">
                Add Expense
            </button>

        </form>

    </div>

    <div class="card">

        <h2>Expense List</h2>

        {% if expenses %}

        <table>

            <tr>

                <th>Title</th>

                <th>Amount</th>

                <th>Category</th>

                <th>Action</th>

            </tr>

            {% for expense in expenses %}

            <tr>

                <td>{{ expense.title }}</td>

                <td>₹ {{ expense.amount }}</td>

                <td>{{ expense.category }}</td>

                <td>

                    <a
                        href="/delete/{{ loop.index0 }}"
                        class="delete-btn"
                    >
                        Delete
                    </a>

                </td>

            </tr>

            {% endfor %}

        </table>

        {% else %}

        <p>No expenses added.</p>

        {% endif %}

    </div>

    <div class="total-box">

        <h2>Total Expense</h2>

        <h1>₹ {{ total }}</h1>

    </div>

    <a href="/" class="logout-btn">
        Logout
    </a>

</div>

<script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
